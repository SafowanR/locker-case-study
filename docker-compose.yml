services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/locker.db
      # PATCH: optional settings read by the patched app (see .env.example)
      APP_URL: ${APP_URL:-}
      ADVISOR_PASSWORD: ${ADVISOR_PASSWORD:-}
    volumes:
      - locker-data:/app/data
    restart: unless-stopped

volumes:
  locker-data:
